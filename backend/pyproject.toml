[project]
name = "underlock-backend"
version = "0.1.0"
description = "Underlock API, worker, and scoring service"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=23,<26",
    "asyncpg>=0.29,<1",
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "PyJWT>=2.8,<3",
    "redis>=5,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=24,<26",
    "uvicorn[standard]>=0.27,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.9,<2",
    "psutil>=5.9,<8",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.3,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api/tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = ["integration: requires live PostgreSQL and Redis Streams services"]

[tool.uv]
package = false